services:
  backend:
    image: ghcr.io/tiaggofg/lumo-backend:latest
    platform: linux/arm64
    container_name: lumo-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      LUMO_FRONTEND_URL: ${LUMO_FRONTEND_URL:?LUMO_FRONTEND_URL is required}
      LUMO_AUTH_JWT_SECRET: ${LUMO_AUTH_JWT_SECRET:?LUMO_AUTH_JWT_SECRET is required}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID is required}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?GOOGLE_OAUTH_CLIENT_SECRET is required}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:?GOOGLE_OAUTH_REDIRECT_URI is required}
      TZ: ${TZ:-America/Sao_Paulo}
      LUMO_TIMEZONE: ${LUMO_TIMEZONE:-America/Sao_Paulo}
      LUMO_AUTH_COOKIE_SECURE: ${LUMO_AUTH_COOKIE_SECURE:-true}
      LUMO_AUTH_COOKIE_SAME_SITE: ${LUMO_AUTH_COOKIE_SAME_SITE:-LAX}
      LUMO_ALLOWED_EMAILS: ${LUMO_ALLOWED_EMAILS:-}
      JAVA_OPTS_APPEND: ${JAVA_OPTS_APPEND:--Dquarkus.http.host=0.0.0.0}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
