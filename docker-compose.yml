services:
  postgres:
    image: postgres:17-alpine
    container_name: lumo-postgres
    environment:
      POSTGRES_DB: lumo_db
      POSTGRES_USER: lumo
      POSTGRES_PASSWORD: lumo
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - lumo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumo -d lumo_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumo-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lumo_db
      DB_USERNAME: lumo
      DB_PASSWORD: lumo
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /q/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lumo-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${LUMO_FRONTEND_PORT:-4200}:80"

volumes:
  lumo_postgres_data:
