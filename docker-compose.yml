services:
  postgres:
    image: postgres:17-alpine
    container_name: lumo-postgres
    environment:
      POSTGRES_DB: lumo_db
      POSTGRES_USER: lumo
      POSTGRES_PASSWORD: lumo
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - lumo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumo -d lumo_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lumo_postgres_data:
