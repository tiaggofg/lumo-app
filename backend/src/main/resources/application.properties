# Application
quarkus.application.name=lumo-backend
lumo.timezone=America/Sao_Paulo

# HTTP & CORS
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:4201,http://127.0.0.1:4201
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-allow-credentials=true

# Database (PostgreSQL)
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME:lumo}
%prod.quarkus.datasource.password=${DB_PASSWORD:lumo}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/lumo_db}

# Dev & Test Dev Services (Testcontainers PostgreSQL 17)
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.image-name=postgres:17-alpine
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml

# OpenAPI & Swagger UI
quarkus.smallrye-openapi.info-title=Lumo API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST do Lumo — Controle Financeiro Pessoal e Familiar
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Jackson
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.fail-on-unknown-properties=false

# Authentication & Google OAuth 2.0
lumo.auth.jwt-secret=${LUMO_AUTH_JWT_SECRET:}
%dev.lumo.auth.jwt-secret=${LUMO_AUTH_JWT_SECRET:lumo-local-dev-jwt-secret-key-do-not-use-in-prod-32bytes}
%test.lumo.auth.jwt-secret=${LUMO_AUTH_JWT_SECRET:lumo-local-test-jwt-secret-key-do-not-use-in-prod-32bytes}

lumo.auth.access-token-ttl=PT15M
lumo.auth.refresh-token-ttl=P30D
lumo.auth.oauth-state-ttl=PT5M

lumo.auth.cookie-secure=${LUMO_AUTH_COOKIE_SECURE:true}
%dev.lumo.auth.cookie-secure=${LUMO_AUTH_COOKIE_SECURE:false}
%test.lumo.auth.cookie-secure=${LUMO_AUTH_COOKIE_SECURE:false}

lumo.auth.dev-login.enabled=false
%dev.lumo.auth.dev-login.enabled=true
%test.lumo.auth.dev-login.enabled=true

lumo.auth.allowed-emails=${LUMO_ALLOWED_EMAILS:}

lumo.auth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
lumo.auth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
lumo.auth.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:4200/api/v1/auth/google/callback}
lumo.auth.google.auth-uri=https://accounts.google.com/o/oauth2/v2/auth
lumo.auth.google.token-uri=https://oauth2.googleapis.com/token
lumo.auth.google.jwks-uri=https://www.googleapis.com/oauth2/v3/certs
lumo.auth.google.http-timeout-seconds=10
